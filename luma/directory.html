<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory | Luma Forsyth County</title>
  <meta name="description" content="Search and filter community resources in Forsyth County, Georgia by category, cost, language and hours.">
  <meta name="theme-color" content="#FCFAF6">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/inner.css">
  <script src="js/prefs.js"></script>
</head>
<body data-page="directory">
  <div data-site-header></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <h1>Directory</h1>
        <p class="lede">Every listing in one place. Search by name or use the filters to narrow it down.</p>
      </div>
    </section>

    <form class="toolbar" data-filter-form onsubmit="return false" aria-label="Filters">
      <div class="container">
        <div class="searchbox">
          <span data-icon="search"></span>
          <label for="dir-q" class="sr-only">Search listings</label>
          <input id="dir-q" type="search" placeholder="Search listings" autocomplete="off">
        </div>
        <details class="dd" data-dd="cat"><summary>Category <span data-icon="chevron-down"></span></summary><div class="dd__panel" data-f-cat></div></details>
        <details class="dd" data-dd="aud"><summary>Who it's for <span data-icon="chevron-down"></span></summary><div class="dd__panel" data-f-aud></div></details>
        <details class="dd" data-dd="more"><summary>More <span data-icon="chevron-down"></span></summary>
          <div class="dd__panel">
            <label class="opt"><input type="checkbox" name="open" value="1">Open right now</label>
            <label class="opt"><input type="checkbox" name="walkin" value="1">Has a walk-in location</label>
            <label class="opt"><input type="checkbox" name="spanish" value="1">Help in Spanish</label>
          </div>
        </details>
        <div class="toolbar__end">
          <label class="sort">Sort
            <select class="select" data-sort>
              <option value="az">A to Z</option>
              <option value="open">Open now first</option>
              <option value="cat">Category</option>
              <option value="near">Nearest to me</option>
            </select>
          </label>
        </div>
      </div>
    </form>

    <section class="container results" aria-labelledby="results-h">
      <h2 id="results-h" class="sr-only">Results</h2>
      <div class="results-bar">
        <p class="results-count" aria-live="polite" data-count></p>
        <div class="active-filters" data-active></div>
      </div>
      <div class="card-grid" data-results></div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="js/icons.js"></script>
  <script src="data/resources.js"></script>
  <script src="data/events.js"></script>
  <script src="js/site.js"></script>
  <script src="js/directory.js"></script>
</body>
</html>
