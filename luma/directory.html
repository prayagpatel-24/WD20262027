<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory | Luma Forsyth County</title>
  <meta name="description" content="Search and filter community resources in Forsyth County, Georgia by category, cost, language and hours.">
  <meta name="theme-color" content="#FCFAF6">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/inner.css">
  <script src="js/prefs.js"></script>
</head>
<body data-page="directory">
  <div data-site-header></div>

  <main id="main" tabindex="-1">
    <section class="page-hero page-hero--inline">
      <div class="container">
        <h1>Directory</h1>
        <p class="results-count" aria-live="polite" data-count></p>
      </div>
    </section>

    <div class="container dir">
      <button class="btn btn--ghost dir__toggle" type="button" aria-expanded="false" aria-controls="dir-filters" data-filters-toggle>Filters <span data-icon="chevron-down"></span></button>

      <form class="dir-filters" id="dir-filters" data-filter-form onsubmit="return false" aria-label="Filters">
        <div class="searchbox">
          <span data-icon="search"></span>
          <label for="dir-q" class="sr-only">Search listings</label>
          <input id="dir-q" type="search" placeholder="Search listings" autocomplete="off">
        </div>

        <label class="toggle">Near me<span class="switch"><input type="checkbox" name="near" value="1"><span></span></span></label>

        <fieldset>
          <legend>Category</legend>
          <div data-f-cat></div>
        </fieldset>
        <fieldset>
          <legend>Who it's for</legend>
          <div data-f-aud></div>
        </fieldset>
        <fieldset>
          <legend>More</legend>
          <label class="opt"><input type="checkbox" name="open" value="1">Open right now</label>
          <label class="opt"><input type="checkbox" name="walkin" value="1">Has a walk-in location</label>
          <label class="opt"><input type="checkbox" name="spanish" value="1">Help in Spanish</label>
        </fieldset>
        <p class="dir-note">Missing a place? <a href="submit.html#add">Suggest a resource</a>.</p>
      </form>

      <section class="dir__results" aria-labelledby="results-h">
        <h2 id="results-h" class="sr-only">Results</h2>
        <div class="results-bar">
          <div class="sort-by" role="group" aria-labelledby="sort-label"><span id="sort-label">Sort by:</span>
            <div class="tabs"><button type="button" data-sort="az">Name</button><button type="button" data-sort="near">Distance</button></div>
          </div>
          <div class="active-filters" data-active></div>
        </div>
        <ol class="cards" data-results></ol>
        <p class="dir-note">Know a place that should be listed? <a href="submit.html#add">Suggest a resource</a>.</p>
      </section>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="js/icons.js"></script>
  <script src="data/resources.js"></script>
  <script src="data/events.js"></script>
  <script src="data/images.js"></script>
  <script src="js/site.js"></script>
  <script src="js/directory.js"></script>
</body>
</html>
