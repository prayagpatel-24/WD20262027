<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Luma Forsyth County</title>
  <meta name="description" content="Elections, markets, support groups and holiday events in Forsyth County, Georgia.">
  <meta name="theme-color" content="#FCFAF6">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/inner.css">
  <script src="js/prefs.js"></script>
</head>
<body data-page="calendar">
  <div data-site-header></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <h1>Calendar</h1>
      </div>
    </section>

    <div class="container events-wrap">
      <div class="tabs" role="group" aria-label="Filter by category" data-ev-cats></div>
      <p class="legend-note"><span class="legend-repeat">Dashed</span> events repeat every week or month. Dates marked <span class="projected">Projected</span> are based on last year, so check with the organizer.</p>

      <div class="cal-layout">
        <div>
          <div class="month-nav">
            <button class="icon-btn" type="button" data-month="-1" aria-label="Previous month"><span data-icon="chevron-left"></span></button>
            <h2 aria-live="polite" data-month-label></h2>
            <button class="icon-btn" type="button" data-month="1" aria-label="Next month"><span data-icon="chevron-right"></span></button>
            <button class="btn btn--ghost btn--sm" type="button" data-today>Today</button>
          </div>
          <div class="cal" data-cal></div>
        </div>
        <section class="day-panel" aria-live="polite" data-day-panel></section>
      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="js/icons.js"></script>
  <script src="data/resources.js"></script>
  <script src="data/events.js"></script>
  <script src="js/site.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
