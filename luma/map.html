<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map | Luma Forsyth County</title>
  <meta name="description" content="Map of community resources in Forsyth County, Georgia, with hours and directions.">
  <meta name="theme-color" content="#FCFAF6">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="lib/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="lib/markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
  <script src="js/prefs.js"></script>
</head>
<body data-page="map">
  <div data-site-header></div>

  <main id="main" tabindex="-1" class="mappage">
    <aside class="mappage__side" aria-labelledby="map-title">
      <div class="mappage__head">
        <h1 id="map-title">Map</h1>
        <p>Click a pin or a name in the list to see details.</p>
      </div>

      <div class="mappage__controls">
        <div class="searchbox">
          <span data-icon="search"></span>
          <label for="map-q" class="sr-only">Search the map</label>
          <input id="map-q" type="search" placeholder="Search by name or street" autocomplete="off">
        </div>
        <div class="chip-row" role="group" aria-label="Category" data-map-cats></div>
        <div class="chip-row">
          <button type="button" class="chip" data-map-toggle="open" aria-pressed="false">Open now</button>
          <button type="button" class="chip" data-locate aria-pressed="false"><span data-icon="locate-fixed"></span>Near me</button>
        </div>
      </div>

      <p class="mappage__count" aria-live="polite" data-map-count></p>
      <ol class="maplist" data-map-list></ol>

      <section class="mappage__countywide" aria-labelledby="cw-title">
        <h2 id="cw-title">Phone and countywide services</h2>
        <p>These don't have a public address to put on the map.</p>
        <ul class="cw-list" data-countywide></ul>
      </section>
    </aside>

    <div class="mappage__map">
      <div id="map" class="leaflet-host" role="region" aria-label="Map of resource locations. The list next to the map has the same places."></div>
      <div class="map-banner" data-offline-banner hidden>
        <span data-icon="info"></span>
        <span>The street map couldn't load, so you're seeing the county outline. The pins still work.</span>
      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="js/icons.js"></script>
  <script src="data/resources.js"></script>
  <script src="data/events.js"></script>
  <script src="data/forsyth-boundary.js"></script>
  <script src="lib/leaflet/leaflet.js"></script>
  <script src="lib/markercluster/leaflet.markercluster.js"></script>
  <script src="js/site.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
